name: build-and-release

# Multi-platform build and package-level consumer tests.
#
# Every platform job builds its host variant(s) and packages, then
# tests the PACKAGES it built: each package test installs the job's
# own release artifacts (npm tarballs, wheel, jar, AAR, browser
# package) into a clean consumer setup and exercises the installed
# package's public API. Body-level checks (the Windows LoadLibrary
# diagnostic host, objdump, the qemu host smoke) are additional
# diagnostics, never a substitute for the package tests.
#
# Release policy: the release job needs every platform job. If any
# job fails, nothing is published.
#
# The Android SDK comes from the runner image; only the platform is
# installed, with the preinstalled sdkmanager (android-actions/
# setup-android is not used: its `sdkmanager tools` step installs a
# package Google no longer publishes).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  linux-x64:
    name: linux-x64 (x86_64-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compilers and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            gcc-mingw-w64-x86-64 \
            libc6-dev-arm64-cross libc6-dev-riscv64-cross \
            qemu-user-static zip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tooling
        run: pip install setuptools wheel
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          java-home-variable: JAVA_HOME_17

      - name: Set up Android NDK r26d
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Install Android platform 35 (runner-provided SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" >/dev/null
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64'

      - name: Build all target variants (x86_64 host)
        env:
          TINYC_NDK_SYSROOT: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: |
          mkdir -p test-outputs
          ./build.sh > test-outputs/build-targets.log 2>&1

      - name: Build cross host variants (aarch64, mingw)
        run: ./build.sh host > test-outputs/build-hosts.log 2>&1

      - name: Host smoke tests (qemu-user; emulator-level for aarch64)
        run: |
          bash tests/test_hosts.sh > test-outputs/host-smoke.log 2>&1
          cp tests/host-test-output.txt test-outputs/

      # The vendor suite and the SIMD differential suites test
      # the compiler in the tree (the package steps below test
      # the packages): what ships is what CI tested. The x86
      # suite compiles every probe at x86-64-v4 on any host and
      # runs the runtime legs only on an AVX-512 host (it prints
      # and counts the skips otherwise).
      - name: Vendor test suite (native form)
        run: |
          (cd vendor-tinycc && ./configure && make -j4 && make test) > test-outputs/vendor-make-test.log 2>&1

      - name: SIMD differential suites and coverage scans (x86_64, riscv64)
        run: |
          bash tests/x86/run_x86_tests.sh > test-outputs/x86-simd-tests.log 2>&1
          python3 tests/x86/scan_surface.py > test-outputs/x86-simd-scan.log 2>&1
          bash tests/riscv64/run_riscv_tests.sh > test-outputs/riscv64-simd-tests.log 2>&1
          python3 tests/riscv64/scan_surface.py > test-outputs/riscv64-simd-scan.log 2>&1

      - name: npm package - bundle, pack, consumer test on the tarballs
        run: |
          cd packages/npm
          npm install --ignore-scripts --omit=optional > ../../test-outputs/npm-install.log 2>&1
          node bundle_native.js
          npm pack --silent
          (cd native-packages/@xnetx/tinyc-native-x86_64-linux-gnu && npm pack --silent)
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/npm-consumer && mkdir -p /tmp/npm-consumer && cd /tmp/npm-consumer
          npm init -y >/dev/null
          npm install --silent \
            "$GITHUB_WORKSPACE"/packages/npm/xnetx-tinyc-[0-9]*.tgz \
            "$GITHUB_WORKSPACE"/packages/npm/native-packages/@xnetx/tinyc-native-x86_64-linux-gnu/*.tgz
          cp "$GITHUB_WORKSPACE/tests/consumer/npm-consumer.test.js" .
          node npm-consumer.test.js > "$GITHUB_WORKSPACE/test-outputs/npm-consumer.log" 2>&1

      - name: Python package - wheel, consumer test in a clean venv
        run: |
          bash packages/python/build_wheel_matrix.sh > test-outputs/wheel-build.log 2>&1
          ls packages/python/dist-wheels/*manylinux*x86_64*.whl
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install packages/python/dist-wheels/*manylinux*x86_64*.whl
          rm -rf /tmp/pyctest && mkdir -p /tmp/pyctest
          cp packages/python/tests/test_tinyc.py /tmp/pyctest/
          (cd /tmp/pyctest && /tmp/venv/bin/python -m unittest test_tinyc) \
            > test-outputs/python-consumer.log 2>&1

      - name: Java package - build jar, run the package test suite (JDK 25)
        run: |
          bash packages/java/build.sh > test-outputs/java-build.log 2>&1
          bash packages/java/run-tests.sh > test-outputs/java-tests.log 2>&1

      # Artifact gate, part 1: the shipped browser sysroot sets
      # must be self-contained. Every header a per-target
      # manifest ships is scanned for the headers it includes;
      # each must resolve inside the same target's shipped set.
      # The browser scope of the host-provided registry is empty
      # by design: the sysroot is freestanding, so nothing may
      # rely on a host header. The audit reads only the
      # manifests and the include trees, so it runs before the
      # browser build and a header-set gap fails in seconds.
      - name: Artifact gate - browser header closure audit
        run: |
          python3 tests/artifact-gate/check_header_closure.py \
            --manifests packages/browser/sysroot-manifests \
            --include-root wasm-backend/include \
            --include-root vendor-tinycc/include \
            --tcclib vendor-tinycc/tcclib.h

      - name: Browser package - build all targets
        run: |
          cd packages/browser
          for t in wasm32-wasi x86_64-linux-gnu aarch64-linux-gnu \
                   riscv64-linux-gnu x86_64-windows aarch64-linux-android \
                   x86_64-linux-android arm64-apple-darwin x86_64-apple-darwin; do
            TARGET=$t ./build.sh >> "$GITHUB_WORKSPACE/test-outputs/browser-build.log" 2>&1
          done

      # Artifact gate, part 2: from here on, the browser package
      # is tested only as the packaged artifact. The npm tarball
      # is packed from the built package and unpacked into a
      # clean directory; the gate asserts the tarball carries
      # the full ESM import closure of its entry points and one
      # sysroot envelope per target under sysroot/, and that the
      # script bundle inside the tarball matches a fresh build
      # of the sources.
      - name: Artifact gate - pack the browser tarball, check contents and bundle
        run: |
          cd packages/browser
          rm -f tinyc-web-*.tgz
          npm pack > "$GITHUB_WORKSPACE/test-outputs/npm-pack.log" 2>&1
          rm -rf /tmp/pkg-gate && mkdir -p /tmp/pkg-gate
          tar -xzf tinyc-web-*.tgz -C /tmp/pkg-gate --strip-components=1
          rm -f tinyc-web-*.tgz
          cd "$GITHUB_WORKSPACE"
          node tests/artifact-gate/check_import_closure.mjs /tmp/pkg-gate
          node tests/artifact-gate/check_sysroot_envelopes.mjs /tmp/pkg-gate
          cd packages/browser
          node build-web-bundle.mjs > "$GITHUB_WORKSPACE/test-outputs/web-bundle-build.log" 2>&1
          if ! cmp -s tinyc-web.js /tmp/pkg-gate/tinyc-web.js; then
            echo "::error::STALE WEB BUNDLE: the tinyc-web.js inside the packaged tarball differs from a fresh build of the current sources. Rebuild it with 'npm run build:web' in packages/browser and commit the result."
            exit 1
          fi
          echo "tinyc-web.js in the tarball is up to date with the sources."

      # Artifact gate, part 3: the gate loads every target's
      # compiler from the tarball and its sysroot from the
      # sysroot envelopes the tarball itself ships under
      # sysroot/ — the same bytes a consumer's loadSysroot
      # fetches — compiles every shipped header standalone
      # against that sysroot, and compiles and runs whole
      # programs on the runnable target. The program runs go
      # through the process layer's simulated tier, which needs
      # JSPI, so the gate runs on emsdk's Node like the thread
      # suite.
      - name: Artifact gate - shipped-header gate and real-compile suite
        run: |
          : "${EMSDK_NODE:?emsdk node (EMSDK_NODE) is not set}"
          "$EMSDK_NODE" --experimental-wasm-jspi tests/artifact-gate/run_header_gate.mjs \
            --pkg /tmp/pkg-gate --sysroot-dir /tmp/pkg-gate/sysroot

      - name: Browser package - real-browser consumer test on the tarball
        run: |
          rm -rf /tmp/browser-consumer && mkdir -p /tmp/browser-consumer
          cp -r /tmp/pkg-gate /tmp/browser-consumer/pkg
          cp tests/consumer/browser-test.html /tmp/browser-consumer/index.html
          rm -rf /tmp/pw && mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium \
            > "$GITHUB_WORKSPACE/test-outputs/playwright-install.log" 2>&1
          cp "$GITHUB_WORKSPACE/tests/consumer/browser-run.mjs" /tmp/pw/browser-run.mjs
          node /tmp/pw/browser-run.mjs /tmp/browser-consumer \
            > "$GITHUB_WORKSPACE/test-outputs/browser-consumer.log" 2>&1

      # The release job assembles the tinyc_web (Pyodide) wheel
      # from the collected release assets. Every target's
      # libtcc1.a comes out of a shipped dist tarball except
      # wasm32-wasi's, which no tarball carries: it exists only
      # here, as a byproduct of the browser build's native make
      # in build/wasm32-src. Ship it in a dedicated artifact; the
      # name matches neither the release job's *release-assets*
      # collection nor its *test-outputs* bundle, so the file is
      # an input to the wheel build, never a published asset.
      - name: Stage the wasm32 libtcc1.a for the Pyodide wheel build
        run: |
          mkdir -p pyodide-wheel-inputs/wasm32-wasi
          cp packages/browser/build/wasm32-src/libtcc1.a \
            pyodide-wheel-inputs/wasm32-wasi/libtcc1.a
      - uses: actions/upload-artifact@v4
        with:
          name: pyodide-wheel-inputs
          path: pyodide-wheel-inputs/
          if-no-files-found: error

      - name: Wasm backend - full regression suite
        run: |
          rc=0
          bash wasm-backend/tests/run-regression.sh || rc=$?
          cp wasm-backend/tests/test-output.txt test-outputs/wasm-backend-regression.log
          exit $rc

      # The §11 thread suite (packages/browser/test-threads) was
      # local-only until run 45779099647, so CI never judged it.
      # It runs here, after the wasm-backend regression built
      # wasm32-tcc, and reuses the Playwright install the
      # browser-consumer step put in /tmp/pw. Both steps run
      # on emsdk's Node 24 (EMSDK_NODE): Node 22's JSPI is
      # incomplete, so the simulated tier's pthread_create
      # fails there. The page runner serves its own COOP/COEP
      # headers, so the real tier needs no special page serving.
      - name: Thread suite - Node simulated tier
        run: |
          : "${EMSDK_NODE:?emsdk node (EMSDK_NODE) is not set}"
          "$EMSDK_NODE" --experimental-wasm-jspi packages/browser/test-threads/run-node.mjs \
            > test-outputs/test-threads-node.log 2>&1

      - name: Thread suite - browser page tiers (real + file simulated)
        env:
          TINYC_PLAYWRIGHT_DIR: /tmp/pw
        run: |
          : "${EMSDK_NODE:?emsdk node (EMSDK_NODE) is not set}"
          "$EMSDK_NODE" packages/browser/test-threads/run-page.mjs \
            > test-outputs/test-threads-page.log 2>&1

      - name: Android package - native libs, then the Gradle AAR
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cd packages/android
          bash build.sh native-libs > ../../test-outputs/android-native-libs.log 2>&1
          file src/main/jniLibs/arm64-v8a/libtinyc.so src/main/jniLibs/x86_64/libtinyc.so
          JAVA_HOME=$JAVA_HOME_17 bash build.sh > ../../test-outputs/android-aar.log 2>&1
          ls -la build/outputs/aar/

      - name: Full repository test suite
        run: bash tests/run_all.sh > test-outputs/run_all.log 2>&1

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          tar -czf release-assets/tinyc-x86_64-linux-gnu.tar.gz -C build/dist .
          tar -czf release-assets/tinyc-aarch64-linux-gnu-cross.tar.gz \
            -C build/dist-host aarch64-linux-gnu
          (cd build/dist-host/x86_64-w64-mingw32 && \
            zip -qr "$GITHUB_WORKSPACE/release-assets/tinyc-x86_64-w64-mingw32-cross.zip" .)
          cp packages/npm/xnetx-tinyc-[0-9]*.tgz release-assets/tinyc-npm-x86_64-linux-gnu.tgz
          cp packages/npm/native-packages/@xnetx/tinyc-native-x86_64-linux-gnu/*.tgz release-assets/
          cp packages/python/dist-wheels/*manylinux*x86_64*.whl release-assets/
          cp packages/java/dist/tinyc.jar release-assets/tinyc-x86_64-linux-gnu.jar
          cp packages/android/build/outputs/aar/tinyc-android-release.aar release-assets/
          (cd packages/browser && zip -qr "$GITHUB_WORKSPACE/release-assets/tinyc-web.zip" \
            index.mjs runtime-shims.mjs threads.mjs vfs-store.mjs worker.mjs tinyc-web.js package.json \
            README.md README.zh-CN.md \
            sysroot-manifest.json sysroot-manifests sysroot tcc-*.tinyc.js)
          ls -la release-assets/

      # The release zip is a separate packaging manifest from
      # the npm tarball, so the artifact gate runs against it
      # too: the ESM import closure, the sysroot envelopes, and
      # the shipped-header gate in headers-only mode (the
      # whole-program runs already covered the same compiler
      # and sysroot bytes through the tarball).
      - name: Artifact gate - release zip contents and headers
        run: |
          : "${EMSDK_NODE:?emsdk node (EMSDK_NODE) is not set}"
          rm -rf /tmp/zip-gate && mkdir -p /tmp/zip-gate
          unzip -q release-assets/tinyc-web.zip -d /tmp/zip-gate
          node tests/artifact-gate/check_import_closure.mjs /tmp/zip-gate
          node tests/artifact-gate/check_sysroot_envelopes.mjs /tmp/zip-gate
          "$EMSDK_NODE" --experimental-wasm-jspi tests/artifact-gate/run_header_gate.mjs \
            --pkg /tmp/zip-gate --sysroot-dir /tmp/zip-gate/sysroot --headers-only

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-x86_64-linux-gnu
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-outputs-linux-x64
          path: |
            test-outputs/
            tests/*-output.txt
          if-no-files-found: warn

  # -----------------------------------------------------------------
  linux-arm64:
    name: linux-arm64 (aarch64-linux-gnu)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The matrix is host-aware: on this aarch64 host the x86_64
      # and riscv64 targets are cross builds against the
      # /usr/<triplet> sysroots these packages provide, and the
      # x86_64 host variant is cross-compiled and smoked
      # under qemu-user (the aarch64 host variant is native).
      - name: Install cross compilers and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-x86-64-linux-gnu gcc-riscv64-linux-gnu \
            libc6-dev-amd64-cross libc6-dev-riscv64-cross \
            qemu-user-static file

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tooling
        run: pip install setuptools wheel
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Only the NDK sysroot files are consumed (target headers and
      # libraries); no NDK host binary is ever executed, so the
      # sysroot is taken from the NDK's linux-x86_64 prebuilt tree,
      # the only Linux prebuilt r26d ships. nttld/setup-ndk has no
      # linux-arm64 host build, so the official zip is downloaded
      # and unpacked directly; the step keeps the ndk-path output
      # the build step below consumes.
      - name: Set up Android NDK r26d (manual download)
        id: ndk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/android-ndk-r26d-linux.zip" \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk-r26d-linux.zip" -d "$RUNNER_TEMP/ndk"
          echo "ndk-path=$RUNNER_TEMP/ndk/android-ndk-r26d" >> "$GITHUB_OUTPUT"
          ls "$RUNNER_TEMP/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" >/dev/null

      - name: Build all target variants (aarch64 host)
        env:
          TINYC_NDK_SYSROOT: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: |
          mkdir -p test-outputs
          ./build.sh > test-outputs/build-targets.log 2>&1

      - name: Build host variants (aarch64 native, x86_64 cross)
        run: ./build.sh host aarch64-linux-gnu x86_64-linux-gnu > test-outputs/build-hosts.log 2>&1

      - name: Host smoke tests (aarch64 native; qemu-user for the cross hosts)
        run: |
          bash tests/test_hosts.sh > test-outputs/host-smoke.log 2>&1
          cp tests/host-test-output.txt test-outputs/

      # The vendor suite in native form (arm64-gen.c compiled as
      # its own translation unit, the form the cross builds mask)
      # and the NEON differential suite: what ships is what CI
      # tested.
      - name: Vendor test suite (native form)
        run: |
          (cd vendor-tinycc && ./configure && make -j4 && make test) > test-outputs/vendor-make-test.log 2>&1

      - name: SIMD differential suite and coverage scan (aarch64 NEON)
        run: |
          bash tests/neon/run_neon_tests.sh > test-outputs/neon-simd-tests.log 2>&1
          python3 tests/neon/scan_surface.py > test-outputs/neon-simd-scan.log 2>&1

      - name: npm package - bundle, pack, consumer test on the tarballs
        run: |
          cd packages/npm
          npm install --ignore-scripts --omit=optional > ../../test-outputs/npm-install.log 2>&1
          node bundle_native.js
          npm pack --silent
          (cd native-packages/@xnetx/tinyc-native-aarch64-linux-gnu && npm pack --silent)
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/npm-consumer && mkdir -p /tmp/npm-consumer && cd /tmp/npm-consumer
          npm init -y >/dev/null
          npm install --silent \
            "$GITHUB_WORKSPACE"/packages/npm/xnetx-tinyc-[0-9]*.tgz \
            "$GITHUB_WORKSPACE"/packages/npm/native-packages/@xnetx/tinyc-native-aarch64-linux-gnu/*.tgz
          cp "$GITHUB_WORKSPACE/tests/consumer/npm-consumer.test.js" .
          node npm-consumer.test.js > "$GITHUB_WORKSPACE/test-outputs/npm-consumer.log" 2>&1

      - name: Python package - wheel, consumer test in a clean venv
        run: |
          bash packages/python/build_wheel_matrix.sh > test-outputs/wheel-build.log 2>&1
          ls packages/python/dist-wheels/*manylinux*aarch64*.whl
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install packages/python/dist-wheels/*manylinux*aarch64*.whl
          rm -rf /tmp/pyctest && mkdir -p /tmp/pyctest
          cp packages/python/tests/test_tinyc.py /tmp/pyctest/
          (cd /tmp/pyctest && /tmp/venv/bin/python -m unittest test_tinyc) \
            > test-outputs/python-consumer.log 2>&1

      - name: Java package - build jar, run the package test suite (JDK 25)
        run: |
          bash packages/java/build.sh > test-outputs/java-build.log 2>&1
          bash packages/java/run-tests.sh > test-outputs/java-tests.log 2>&1

      # Last, like in the linux-x64 job: the suite's package
      # sections exercise the in-tree staging the bundle steps above
      # leave behind for this host.
      - name: Full repository test suite on the aarch64 host
        run: bash tests/run_all.sh > test-outputs/run_all.log 2>&1

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          tar -czf release-assets/tinyc-aarch64-linux-gnu.tar.gz -C build/dist .
          cp packages/npm/xnetx-tinyc-[0-9]*.tgz release-assets/tinyc-npm-aarch64-linux-gnu.tgz
          cp packages/npm/native-packages/@xnetx/tinyc-native-aarch64-linux-gnu/*.tgz release-assets/
          cp packages/python/dist-wheels/*manylinux*aarch64*.whl release-assets/
          cp packages/java/dist/tinyc.jar release-assets/tinyc-aarch64-linux-gnu.jar
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-aarch64-linux-gnu
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-outputs-linux-arm64
          path: |
            test-outputs/
            tests/*-output.txt
          if-no-files-found: warn

  # -----------------------------------------------------------------
  windows:
    name: windows (x86_64-w64-mingw32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tooling
        run: pip install setuptools wheel
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: msys2/setup-msys2@v2
        with:
          # MINGW64 is the MSYS2 environment built for the native
          # MinGW toolchain installed below; the MSYS environment is
          # for MSYS-targeted software and its POSIX path view does
          # not match the native compiler's (TCC's configure probe
          # failed to find its own conftest.c under it).
          msystem: MINGW64
          install: make python file mingw-w64-x86_64-gcc

      # The MinGW recipe is the same one verified by cross-building on
      # Linux (build.sh host x86_64-w64-mingw32); here the C compiler
      # is the runner's native MinGW gcc.
      - name: Build the Windows dual-form EXE (native MinGW)
        shell: msys2 {0}
        run: |
          mkdir -p test-outputs
          export PATH=/mingw64/bin:$PATH
          export TINYC_MINGW_CC=gcc
          bash build.sh host x86_64-w64-mingw32 > test-outputs/build-host.log 2>&1
          file build/dist-host/x86_64-w64-mingw32/bin/tinyc.exe

      # Body-level smoke first: the EXE as a plain CLI. If this
      # passes and the LoadLibrary diagnostic below fails, the fault
      # is in the library-load path, not in the EXE itself.
      - name: Smoke - run the dual-form EXE as a CLI
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          EXE=$PWD/build/dist-host/x86_64-w64-mingw32/bin/tinyc.exe
          "$EXE" -dumpversion
          rm -rf /tmp/cli-smoke && mkdir -p /tmp/cli-smoke && cd /tmp/cli-smoke
          printf '#include <stdio.h>\nint main(void) { printf("hello from tinyc CLI\\n"); return 0; }\n' > hello.c
          "$EXE" hello.c -o hello.exe
          ./hello.exe > hello.out 2>&1
          grep -q "hello from tinyc CLI" hello.out

      - name: Diagnostic - LoadLibrary host test on the built EXE
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          LOG=$PWD/test-outputs/win-host-test.log
          EXE=$PWD/build/dist-host/x86_64-w64-mingw32/bin/tinyc.exe
          objdump -p "$EXE" > "$(dirname "$LOG")/win-exe-objdump-p.txt" 2>&1 || true
          objdump -h "$EXE" > "$(dirname "$LOG")/win-exe-sections.txt" 2>&1 || true
          objdump -d "$EXE" > "$(dirname "$LOG")/win-exe-disasm.txt" 2>&1 || true
          gcc -O2 -o /tmp/win_host_test.exe tests/consumer/win_host_test.c
          rm -rf /tmp/wht && mkdir -p /tmp/wht && cd /tmp/wht
          RC=0
          /tmp/win_host_test.exe "$EXE" > "$LOG" 2>&1 || RC=$?
          cp win_host_test.markers "$(dirname "$LOG")/" 2>/dev/null || true
          cp tinyc_init.markers "$(dirname "$LOG")/" 2>/dev/null || true
          echo "win_host_test exit code: $RC" >> "$LOG"
          exit $RC

      # SIMD execution evidence on this platform: the script
      # compiles the x86-64-v3 smoke probes (cases extracted
      # from the differential suite's generated probes) with
      # the built tinyc.exe and with MinGW gcc, runs both
      # natively and diffs the outputs, plus a compile-only
      # x86-64-v4 leg. It runs under Git Bash and locates the
      # MinGW toolchain the msys2 steps above installed.
      - name: SIMD native smoke (PE)
        shell: bash
        run: |
          bash tests/windows/run_windows_simd_smoke.sh > test-outputs/win-simd-smoke.log 2>&1

      # Feature evidence for the win32 target surface the
      # header-consistency pass completed: the pthread program
      # (linked with no -lpthread; its imports are checked to
      # stay within the Windows system DLLs) and the Winsock
      # getaddrinfo/loopback program, both compiled with the
      # built tinyc.exe and run natively.
      - name: Feature smoke (PE)
        shell: bash
        run: |
          bash tests/windows/run_windows_feature_smoke.sh > test-outputs/win-feature-smoke.log 2>&1

      # Cross-frame unwind evidence for the __chkstk prolog: a
      # >=4096-byte frame's UNWIND_INFO must put the frame setup
      # codes at the end of the call to __chkstk (prolog offset
      # 10), not at the small-frame offsets.  The test unwinds a
      # fabricated context from inside the prolog with
      # RtlVirtualUnwind, the engine SEH uses, and checks the
      # metadata through RtlLookupFunctionEntry.
      - name: Chkstk unwind (PE)
        shell: bash
        run: |
          bash tests/windows/run_windows_chkstk_unwind.sh > test-outputs/win-chkstk-unwind.log 2>&1

      - name: Stage the packaging dist from the host build
        shell: msys2 {0}
        run: |
          rm -rf stage-dist && mkdir -p stage-dist
          cp -r build/dist-host/x86_64-w64-mingw32 stage-dist/

      - name: Java package - build jar, run the package test suite (JDK 25)
        shell: msys2 {0}
        run: |
          export JAVA_HOME=$(cygpath -u "$JAVA_HOME")
          export TINYC_DIST_DIR=$PWD/stage-dist
          bash packages/java/build.sh > test-outputs/java-build.log 2>&1
          bash packages/java/run-tests.sh > test-outputs/java-tests.log 2>&1

      - name: npm package - bundle, pack, consumer test on the tarballs
        shell: msys2 {0}
        env:
          # The MSYS2 login shell rebuilds PATH from MSYS2_PATH_TYPE,
          # and the setup-msys2 default (minimal) replaces the
          # inherited PATH with the Windows system directories alone,
          # dropping the hosted tool cache entry setup-node added and
          # leaving npm/node unresolvable. Inherit the full PATH for
          # this step only; the MSYS2 directories still precede it.
          MSYS2_PATH_TYPE: inherit
        run: |
          export TINYC_DIST_DIR=$PWD/stage-dist
          WS=$PWD
          cd packages/npm
          npm install --ignore-scripts --omit=optional > ../../test-outputs/npm-install.log 2>&1
          node bundle_native.js
          npm pack --silent
          (cd native-packages/@xnetx/tinyc-native-x86_64-w64-mingw32 && npm pack --silent)
          cd "$WS"
          rm -rf /tmp/npm-consumer && mkdir -p /tmp/npm-consumer && cd /tmp/npm-consumer
          npm init -y >/dev/null
          npm install --silent \
            "$WS"/packages/npm/xnetx-tinyc-[0-9]*.tgz \
            "$WS"/packages/npm/native-packages/@xnetx/tinyc-native-x86_64-w64-mingw32/*.tgz
          cp "$WS/tests/consumer/npm-consumer.test.js" .
          node npm-consumer.test.js > "$WS/test-outputs/npm-consumer.log" 2>&1

      - name: Python package - wheel, consumer test in a clean venv
        shell: pwsh
        run: |
          $env:TINYC_DIST_DIR = "$env:GITHUB_WORKSPACE\stage-dist"
          cd packages/python
          python bundle_native.py x86_64-w64-mingw32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TINYC_WHEEL_PLAT = 'win_amd64'
          python -m pip wheel . -w dist-wheels --no-deps --no-build-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd $env:GITHUB_WORKSPACE
          python -m venv C:\tmp\venv
          $wheel = (Get-ChildItem packages/python/dist-wheels/*win_amd64*.whl).FullName
          C:\tmp\venv\Scripts\pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force C:\tmp\pyctest | Out-Null
          Copy-Item packages/python/tests/test_tinyc.py C:\tmp\pyctest\
          cd C:\tmp\pyctest
          C:\tmp\venv\Scripts\python -m unittest test_tinyc *> $env:GITHUB_WORKSPACE\test-outputs\python-consumer.log
          if ($LASTEXITCODE -ne 0) { Get-Content $env:GITHUB_WORKSPACE\test-outputs\python-consumer.log; exit $LASTEXITCODE }

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path build/dist-host/x86_64-w64-mingw32/* `
            -DestinationPath release-assets/tinyc-x86_64-w64-mingw32.zip
          Copy-Item packages/npm/xnetx-tinyc-[0-9]*.tgz release-assets/tinyc-npm-x86_64-w64-mingw32.tgz
          Copy-Item packages/npm/native-packages/@xnetx/tinyc-native-x86_64-w64-mingw32/*.tgz release-assets/
          Copy-Item packages/python/dist-wheels/*win_amd64*.whl release-assets/
          Copy-Item packages/java/dist/tinyc.jar release-assets/tinyc-x86_64-w64-mingw32.jar
          Get-ChildItem release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-x86_64-w64-mingw32
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-outputs-windows
          path: test-outputs/
          if-no-files-found: warn

  # -----------------------------------------------------------------
  macos:
    name: macos (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels: jobs on macos-14 were cancelled at
          # creation with the annotation "The configuration
          # 'macos-14-arm64-us-default' is not supported" (no runner
          # was ever assigned), and jobs on the retired macos-13
          # Intel image never received a runner at all. The current
          # labels are macos-15 (arm64) and macos-15-intel (x86_64).
          - runner: macos-15
            triple: arm64-apple-darwin
            isa: '{"arch":"aarch64","bits":64,"endian":"little","simd":["neon"]}'
          - runner: macos-15-intel
            triple: x86_64-apple-darwin
            isa: '{"arch":"x86_64","bits":64,"endian":"little","simd":["sse","sse2","avx","avx2"]}'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tooling
        run: pip install setuptools wheel
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build the macOS dual-form kernel (mac-test-bundle)
        run: |
          mkdir -p test-outputs
          bash mac-test-bundle/build-mac.sh > test-outputs/mac-build.log 2>&1
          test -x mac-test-bundle/dist/bin/tinyc

      # The bundle's full suite is the regression gate: any FAIL
      # line fails the job. The suite's expectations encode the
      # accepted macOS limitation (TCC reads ELF objects only;
      # clang Mach-O .o/.a inputs are rejected with established
      # failure signatures - design doc 5.3), so a FAIL means the
      # behavior deviated from the recorded facts in either
      # direction.
      - name: Run the macOS bundle test suite (regression)
        run: |
          bash mac-test-bundle/run-tests.sh > test-outputs/mac-tests.log 2>&1 || true
          cat test-outputs/mac-build.log test-outputs/mac-tests.log > test-outputs/result.log
          if grep -q '^FAIL: ' test-outputs/mac-tests.log; then
            echo "test failures:"; grep '^FAIL: ' test-outputs/mac-tests.log; exit 1
          fi
          grep -c '^PASS: ' test-outputs/mac-tests.log

      # SDK-free verification of the bundled Darwin headers: the
      # battery and the ABI probe build and run with the SDK
      # hidden, the probe output diffed against the SDK-built
      # reference. A failure fails the job; the log lands in
      # test-outputs with the rest.
      - name: SDK-free battery (bundled Darwin headers)
        run: |
          bash tests/macos/run_macos_sdkfree.sh > test-outputs/mac-sdkfree.log 2>&1

      # SIMD execution evidence on this platform: the script
      # runs the shipped bundle kernel built above on the SIMD
      # probes as Mach-O executables, diffed against clang:
      # NEON probe files on arm64, the x86-64-v3 smoke source
      # on x86_64.
      - name: SIMD native smoke (Mach-O)
        run: |
          bash tests/macos/run_macos_simd_smoke.sh > test-outputs/mac-simd-smoke.log 2>&1

      - name: Stage the packaging dist from the bundle build
        run: |
          TRIPLE=${{ matrix.triple }}
          SD=$PWD/stage-dist/$TRIPLE
          mkdir -p "$SD/bin" "$SD/lib/tcc" "$SD/include"
          cp mac-test-bundle/dist/bin/tinyc "$SD/bin/tinyc"
          cp mac-test-bundle/dist/lib/tcc/libtcc1.a "$SD/lib/tcc/"
          # The libtcc support objects (runmain.o for -run, the
          # bcheck/backtrace objects) sit next to libtcc1.a in the
          # bundle dist, as in the Linux layout; stage them too.
          cp mac-test-bundle/dist/lib/tcc/*.o "$SD/lib/tcc/"
          cp -r mac-test-bundle/dist/lib/tcc/include "$SD/lib/tcc/include"
          # The bundled Darwin headers and the .tbd link stubs are
          # part of the bundle dist too (darwin-dist.py staged
          # them); the packages below are built from stage-dist,
          # so stage them here as well.
          cp -r mac-test-bundle/dist/lib/tcc/include-libc "$SD/lib/tcc/include-libc"
          mkdir -p "$SD/lib/tcc/lib"
          cp mac-test-bundle/dist/lib/tcc/lib/*.tbd "$SD/lib/tcc/lib/"
          cp mac-test-bundle/dist/include/libtcc.h "$SD/include/"
          cp core/tinyc_io.h "$SD/include/"
          python3 - "$SD/manifest.json" "$TRIPLE" '${{ matrix.isa }}' <<'EOF'
          import json, sys
          path, triple, isa = sys.argv[1], sys.argv[2], json.loads(sys.argv[3])
          outputs = {
              "exe":    {"format": "Mach-O executable", "ext": ""},
              "obj":    {"format": "Mach-O object", "ext": ".o"},
              "shared": {"format": "Mach-O dylib", "ext": ".dylib"},
              "ar":     {"format": "ar archive", "ext": ".a"},
          }
          manifest = {
              "name": "tinyc", "version": "0.9.28rc", "target": triple,
              "isa": isa, "outputs": outputs, "dual_file": "bin/tinyc",
              "toolchain_include": "include",
              "libtcc1": "lib/tcc/libtcc1.a",
              "libc": "Darwin libc headers bundled (vendor-darwin, self-written); programs link the system libSystem.B.dylib dynamically",
              "libc_headers": "lib/tcc/include-libc",
              "libc_lib": "lib/tcc/lib",
          }
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
          EOF

      - name: npm package - bundle, pack, consumer test on the tarballs
        env:
          TINYC_DIST_DIR: ${{ github.workspace }}/stage-dist
        run: |
          cd packages/npm
          npm install --ignore-scripts --omit=optional > ../../test-outputs/npm-install.log 2>&1
          node bundle_native.js
          npm pack --silent
          (cd native-packages/@xnetx/tinyc-native-${{ matrix.triple }} && npm pack --silent)
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/npm-consumer && mkdir -p /tmp/npm-consumer && cd /tmp/npm-consumer
          npm init -y >/dev/null
          npm install --silent \
            "$GITHUB_WORKSPACE"/packages/npm/xnetx-tinyc-[0-9]*.tgz \
            "$GITHUB_WORKSPACE"/packages/npm/native-packages/@xnetx/tinyc-native-${{ matrix.triple }}/*.tgz
          cp "$GITHUB_WORKSPACE/tests/consumer/npm-consumer.test.js" .
          node npm-consumer.test.js > "$GITHUB_WORKSPACE/test-outputs/npm-consumer.log" 2>&1

      - name: Python package - wheel, consumer test in a clean venv
        env:
          TINYC_DIST_DIR: ${{ github.workspace }}/stage-dist
        run: |
          bash packages/python/build_wheel_matrix.sh > test-outputs/wheel-build.log 2>&1
          ls packages/python/dist-wheels/*.whl
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install packages/python/dist-wheels/*.whl
          rm -rf /tmp/pyctest && mkdir -p /tmp/pyctest
          cp packages/python/tests/test_tinyc.py /tmp/pyctest/
          (cd /tmp/pyctest && /tmp/venv/bin/python -m unittest test_tinyc) \
            > test-outputs/python-consumer.log 2>&1

      - name: Java package - build jar, run the package test suite (JDK 25)
        env:
          TINYC_DIST_DIR: ${{ github.workspace }}/stage-dist
        run: |
          bash packages/java/build.sh > test-outputs/java-build.log 2>&1
          bash packages/java/run-tests.sh > test-outputs/java-tests.log 2>&1

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          tar -czf release-assets/tinyc-${{ matrix.triple }}.tar.gz \
            -C mac-test-bundle/dist .
          cp packages/npm/xnetx-tinyc-[0-9]*.tgz release-assets/tinyc-npm-${{ matrix.triple }}.tgz
          cp packages/npm/native-packages/@xnetx/tinyc-native-${{ matrix.triple }}/*.tgz release-assets/
          cp packages/python/dist-wheels/*.whl release-assets/
          cp packages/java/dist/tinyc.jar release-assets/tinyc-${{ matrix.triple }}.jar
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.triple }}
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-outputs-macos-${{ matrix.triple }}
          path: test-outputs/
          if-no-files-found: warn

  # -----------------------------------------------------------------
  # The AAR built by linux-x64, consumed as a dependency of a minimal
  # test app on an x86_64 emulator (API 30). The arm64 .so in the AAR
  # is build- and format-verified only; the emulator is x86_64.
  android-emulator:
    name: android-emulator (AAR consumer test, x86_64 API 30)
    needs: linux-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 35 (runner-provided SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch the AAR built by linux-x64
        uses: actions/download-artifact@v4
        with:
          name: release-assets-x86_64-linux-gnu
          path: fetched-assets
      - name: Place the AAR where the consumer test expects it
        run: |
          mkdir -p packages/android/build/outputs/aar
          cp fetched-assets/tinyc-android-release.aar \
            packages/android/build/outputs/aar/
          unzip -l packages/android/build/outputs/aar/tinyc-android-release.aar \
            | grep libtinyc
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the AAR consumer tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel
          script: cd packages/android/consumer-test && gradle :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-outputs-android-emulator
          path: |
            packages/android/consumer-test/app/build/outputs/androidTest-results/
            packages/android/consumer-test/app/build/reports/androidTests/
          if-no-files-found: warn

  # -----------------------------------------------------------------
  # Needs every platform job: any failure above means no release.
  release:
    name: release
    needs: [linux-x64, linux-arm64, windows, macos, android-emulator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tooling
        run: pip install setuptools wheel
      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Collect release files and bundle the test outputs
        run: |
          mkdir -p release-files
          find all-artifacts -path '*release-assets*' -type f \
            -exec cp {} release-files/ \;
          (cd all-artifacts && zip -qr "$GITHUB_WORKSPACE/release-files/test-outputs.zip" \
            . -i '*test-outputs*/*')
          ls -la release-files/

      # The tinyc_web wheel (the Pyodide package) is built here,
      # from the same collected assets as every other release
      # file, by the package's own bundling script: the compiler
      # envelopes and the target manifests come out of the
      # shipped tinyc-web.zip, each target's libtcc1.a comes out
      # of its shipped dist tarball, and the sysroot headers come
      # from this checkout. The one input no tarball carries is
      # wasm32-wasi's libtcc1.a (a byproduct of the browser
      # build's native make), which the linux-x64 job ships in
      # the pyodide-wheel-inputs artifact. The wheel version
      # comes from packages/pyodide/pyproject.toml.
      - name: Build the tinyc_web wheel (Pyodide package)
        run: |
          mkdir -p wheel-build/tinyc-web wheel-build/libtcc1 wheel-build/dist
          unzip -q release-files/tinyc-web.zip -d wheel-build/tinyc-web
          tar -xzf release-files/tinyc-x86_64-linux-gnu.tar.gz \
            -C wheel-build/dist
          for t in x86_64-linux-gnu aarch64-linux-gnu riscv64-linux-gnu \
                   x86_64-linux-android aarch64-linux-android; do
            mkdir -p "wheel-build/libtcc1/$t"
            cp "wheel-build/dist/$t/lib/tcc/libtcc1.a" "wheel-build/libtcc1/$t/"
          done
          mkdir -p wheel-build/libtcc1/x86_64-windows
          cp wheel-build/dist/x86_64-w64-mingw32/lib/tcc/win32/lib/libtcc1.a \
            wheel-build/libtcc1/x86_64-windows/
          for t in arm64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "wheel-build/libtcc1/$t" "wheel-build/dist-$t"
            tar -xzf "release-files/tinyc-$t.tar.gz" -C "wheel-build/dist-$t"
            cp "wheel-build/dist-$t/lib/tcc/libtcc1.a" "wheel-build/libtcc1/$t/"
          done
          mkdir -p wheel-build/libtcc1/wasm32-wasi
          cp all-artifacts/pyodide-wheel-inputs/wasm32-wasi/libtcc1.a \
            wheel-build/libtcc1/wasm32-wasi/
          python3 packages/pyodide/bundle_assets.py \
            --from-dir wheel-build/tinyc-web \
            --libtcc1-dir wheel-build/libtcc1
          python3 - <<'EOF'
          import json
          targets = json.load(open("packages/pyodide/tinyc_web/assets/targets.json"))["targets"]
          assert len(targets) == 9, f"expected 9 bundled targets, got {len(targets)}"
          print("wheel assets OK: 9 targets bundled")
          EOF
          (cd packages/pyodide && python3 -m pip wheel . \
            -w "$GITHUB_WORKSPACE/release-files" --no-deps --no-build-isolation)
          ls release-files/tinyc_web-*-py3-none-any.whl
          ls -la release-files/

      # The wheel is tested the way a consumer receives it: the
      # wheel file itself is installed into a clean Pyodide, and
      # the package's shared case list runs against the installed
      # package. The harness dependencies (the pyodide npm
      # package) come from packages/pyodide/tests.
      # The wheel test drives the sync tier through callPromising,
      # which needs JSPI (WebAssembly stack switching). Node 22
      # only exposes it behind --experimental-wasm-jspi.
      - name: Test the tinyc_web wheel in a clean Pyodide
        run: |
          cd packages/pyodide/tests
          npm ci --silent
          node --experimental-wasm-jspi run_wheel.mjs "$GITHUB_WORKSPACE"/release-files/tinyc_web-*-py3-none-any.whl

      # The browser package is built and packed in the linux-x64
      # job, where the two macOS targets' sysroot envelopes carry
      # their headers only: their libtcc1.a is a macOS build
      # product that does not exist on that runner. The macOS
      # jobs' dist tarballs are collected above like every other
      # release file (the wheel build extracts the same
      # libtcc1.a files from them), so the two envelopes are
      # regenerated here with their libraries and the zip is
      # repacked; the gate step below then holds the published
      # zip to the complete-envelope standard.
      - name: Complete the macOS sysroot envelopes in the release zip
        run: |
          mkdir -p darwin-envelopes/dist-arm64 darwin-envelopes/dist-x86_64 darwin-envelopes/web
          tar -xzf release-files/tinyc-arm64-apple-darwin.tar.gz \
            -C darwin-envelopes/dist-arm64
          tar -xzf release-files/tinyc-x86_64-apple-darwin.tar.gz \
            -C darwin-envelopes/dist-x86_64
          unzip -q release-files/tinyc-web.zip -d darwin-envelopes/web
          node packages/browser/build-sysroot-envelopes.mjs \
            --target arm64-apple-darwin --target x86_64-apple-darwin \
            --lib arm64-apple-darwin="$PWD/darwin-envelopes/dist-arm64/lib/tcc/libtcc1.a" \
            --lib x86_64-apple-darwin="$PWD/darwin-envelopes/dist-x86_64/lib/tcc/libtcc1.a" \
            --require-libs
          cp packages/browser/sysroot/sysroot-arm64-apple-darwin.tinyc.js \
             packages/browser/sysroot/sysroot-x86_64-apple-darwin.tinyc.js \
             darwin-envelopes/web/sysroot/
          rm release-files/tinyc-web.zip
          (cd darwin-envelopes/web && \
            zip -qr "$GITHUB_WORKSPACE/release-files/tinyc-web.zip" .)
          unzip -l release-files/tinyc-web.zip | grep 'sysroot-.*\.tinyc\.js'

      # Artifact gate, release side: the published zip's sysroot
      # envelopes are checked with the macOS exception lifted
      # (--require-libs): after the completion step above, every
      # target's envelope, the macOS two included, must carry
      # its libtcc1.a.
      - name: Artifact gate - release zip sysroot envelopes, macOS libraries required
        run: |
          rm -rf /tmp/release-zip-gate && mkdir -p /tmp/release-zip-gate
          unzip -q release-files/tinyc-web.zip -d /tmp/release-zip-gate
          node tests/artifact-gate/check_sysroot_envelopes.mjs \
            /tmp/release-zip-gate --require-libs

      # The header catalog (tinyc-headers-<version>.md) is
      # generated here, from the same collected assets as every
      # other release file: the native builtin header sets come
      # out of the shipped dist tarballs (the same tarballs the
      # wheel build extracts its libtcc1.a files from), and the
      # browser sysroot sets come from the per-target manifests
      # in this checkout, whose header contents resolve to this
      # checkout's wasm-backend and vendor include trees - the
      # same sources the sysroot envelopes were generated from.
      # The version comes from packages/npm/package.json, the
      # same source the npm tarball names derive from.
      - name: Generate the header catalog
        run: |
          mkdir -p catalog-build/native
          tar -xzf release-files/tinyc-x86_64-linux-gnu.tar.gz \
            -C catalog-build/native
          for t in arm64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "catalog-build/native/$t"
            tar -xzf "release-files/tinyc-$t.tar.gz" \
              -C "catalog-build/native/$t"
          done
          VER=$(python3 -c "import json; print(json.load(open('packages/npm/package.json'))['version'])")
          python3 tools/gen_header_catalog.py \
            --native-root catalog-build/native \
            --version "$VER" \
            --out "release-files/tinyc-headers-$VER.md"
          ls -la release-files/

      # Artifact gate: the shipped native header sets, audited
      # against the same extracted dists the header catalog is
      # generated from. Every header a shipped header includes
      # must be in the same triple's shipped set or registered
      # in header_host_provided.json with its provider. The
      # bundled libc header trees (glibc, bionic, Darwin) are
      # part of the shipped sets; the registry covers only the
      # MinGW triple's Win32 API references (the MinGW-w64
      # header set) and the glibc dispatch headers for ABIs
      # the bundled trees do not carry.
      - name: Artifact gate - native header closure audit
        run: |
          python3 tests/artifact-gate/check_header_closure.py \
            --native-dist x86_64-linux-gnu=catalog-build/native/x86_64-linux-gnu \
            --native-dist aarch64-linux-gnu=catalog-build/native/aarch64-linux-gnu \
            --native-dist riscv64-linux-gnu=catalog-build/native/riscv64-linux-gnu \
            --native-dist x86_64-linux-android=catalog-build/native/x86_64-linux-android \
            --native-dist aarch64-linux-android=catalog-build/native/aarch64-linux-android \
            --native-dist x86_64-w64-mingw32=catalog-build/native/x86_64-w64-mingw32 \
            --native-dist arm64-apple-darwin=catalog-build/native/arm64-apple-darwin \
            --native-dist x86_64-apple-darwin=catalog-build/native/x86_64-apple-darwin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release-files/* \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Automated multi-platform build of ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ). Every asset was consumer-tested in its platform job against the built packages (npm tarballs, wheels, jars, the Android AAR on an emulator, the browser package in headless Chromium); per-job logs are in test-outputs.zip. Host binaries: tinyc-<triple> tarballs/zips; the aarch64 Linux -cross tarball is cross-built on x86_64 Linux and qemu-smoke-tested (emulator-level), and the MinGW -cross zip is cross-built there and executed on the Windows runner."
