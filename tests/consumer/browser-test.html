<!DOCTYPE html>
<meta charset="utf-8">
<title>tinyc browser consumer test</title>
<!--
  Browser consumer test page. Serve the directory containing this
  file over HTTP with ./pkg/ holding the unpacked packaged
  artifact (index.mjs, the per-target compiler envelopes
  tcc-<target>.tinyc.js and the sysroot manifests), including
  the sysroot envelopes the artifact itself ships under
  ./pkg/sysroot/ — the canonical location the loader derives
  from the package's own URL. Drive it with browser-run.mjs
  (Playwright) or any headless Chrome. Results land on
  window.__TINYC_LOG__ / __TINYC_OK__ / __TINYC_DONE__.

  The test consumes the packaged artifact only:
    1. wasm32-wasi: compile a hello that writes through the WASI
       fd_write import, then run the product through the package's
       shim layer (runWasmModule) and assert the captured output and
       the return value.
    2. wasm32-wasi, fine-grained state API against the real module:
       createState, compileString and compileFile, then invoke the
       compiled function and assert its return value. Creating a
       state registers a JS error callback in the module's function
       table, so this also covers the shipped build keeping that
       table growable. A third state's product is checked to export
       only its own function: the backend's function registry
       belongs to one output cycle of one state, so functions from
       earlier states must not leak into a later state's module.
    3. x86_64-linux-gnu: cross-compile an object file and verify the
       ELF header and e_machine (format check only; the product is
       not runnable in a browser).
    4. The shipped sysroot, loaded the way a consumer loads it
       (loadTinyc with sysroot: true, envelopes fetched from
       ./pkg/sysroot/): a wasm32-wasi program that includes
       <stdatomic.h> compiles and runs against it, and an
       x86_64-linux-gnu translation unit including <stdint.h>
       cross-compiles to an ELF object against it.
    5. wasm32-wasi stdio: a whole program including <stdio.h>,
       <string.h>, <stdlib.h> and <ctype.h> runs against the
       shipped sysroot — fopen/fgets/fread/fprintf over files in
       the instance's virtual FS, which the host stages before
       the run and reads back after it.
    6. wasm32-wasi math: a generated program calling every
       function <math.h> declares, in all three forms, on a
       grid of representative arguments, with the host checking
       each result's bit pattern against reference values under
       a per-function tolerance class.
    7. wasm32-wasi stdio completion: fdopen, tmpfile,
       setvbuf/setbuf and perror over the layer's errno store,
       in one whole program against the shipped sysroot.
-->
<script type="module">
import { loadTinyc, runWasmModule, TCC_OUTPUT } from './pkg/index.mjs';

const log = [];
let ok = true;
function check(name, cond) {
  log.push((cond ? 'PASS: ' : 'FAIL: ') + name);
  if (!cond) ok = false;
}

try {
  const t = await loadTinyc({ target: 'wasm32-wasi' });
  log.push('INFO: wasm32-wasi fsBackend=' + t.fsBackend);
  const src = [
    'typedef struct { const void *buf; unsigned int len; } ciovec_t;',
    'extern int fd_write(int fd, const void *iovs, int iovs_len, void *nwritten);',
    'static const char msg[] = "hello from wasm32\\n";',
    'int hello(void) {',
    '    ciovec_t iov;',
    '    int nw = 0;',
    '    iov.buf = msg;',
    '    iov.len = sizeof(msg) - 1;',
    '    fd_write(1, &iov, 1, &nw);',
    '    return nw;',
    '}',
    '',
  ].join('\n');
  t.addFile('/hello.c', src);
  log.push('INFO: vfs files after addFile: ' + JSON.stringify(t.fs.listFiles('/')));
  const rc = t.callMain(['/hello.c', '-nostdlib', '-o', '/hello.wasm']);
  check('wasm32-wasi compile via callMain returns 0', rc === 0);
  const bytes = t.exportFile('/hello.wasm');
  check('wasm32 product has the wasm magic',
    bytes[0] === 0x00 && bytes[1] === 0x61 && bytes[2] === 0x73 && bytes[3] === 0x6d);
  const bytesAgain = t.exportFile('/hello.wasm');
  check('re-exporting the same product returns identical bytes',
    bytesAgain.length === bytes.length &&
    bytesAgain.every((b, i) => b === bytes[i]));
  const dec = new TextDecoder();
  let text = '';
  const io = {
    out: (b) => { text += dec.decode(b, { stream: true }); },
    err: (b) => { text += dec.decode(b, { stream: true }); },
  };
  const ret = await runWasmModule(bytes, { entry: 'hello', io });
  check('wasm32 hello returns the byte count it wrote (18)', ret === 18);
  check('wasm32 hello output arrives through the fd_write shim',
    text === 'hello from wasm32\n');

  const st = t.createState();
  check('state compileString returns 0',
    st.compileString('int answer() { return 42; }') === 0);
  // run() returns a promise for a dylink product (the run goes
  // through a threaded process; threads design §2.3), so the
  // entry's return value is awaited, not compared synchronously.
  check('state-compiled answer() returns 42',
    await st.run([], { entry: 'answer' }) === 42);
  st.delete();

  t.addFile('/answer.c', 'int answer2() { return 42; }\n');
  const st2 = t.createState();
  check('state compileFile returns 0', st2.compileFile('/answer.c') === 0);
  check('file-compiled answer2() returns 42',
    await st2.run([], { entry: 'answer2' }) === 42);
  st2.delete();

  // A later state's product must contain only its own program's
  // functions: the backend's function registry belongs to one
  // output cycle of one state, so answer/answer2 from the states
  // above must not leak into this state's module. The product is
  // written and exported exactly once (exportFile mirrors the
  // product into the virtual FS, so the bytes are read from this
  // single export), then instantiated directly.
  const st3 = t.createState();
  check('third state compileString returns 0',
    st3.compileString('int answer3() { return 42; }') === 0);
  st3.setOutputType(TCC_OUTPUT.EXE);
  check('third state outputFile returns 0',
    st3.outputFile('/answer3.wasm') === 0);
  const mod3 = new WebAssembly.Module(t.exportFile('/answer3.wasm'));
  const mod3Fns = WebAssembly.Module.exports(mod3)
    .filter((e) => e.kind === 'function').map((e) => e.name);
  check('third state module exports answer3', mod3Fns.includes('answer3'));
  check('third state module does not export answer or answer2',
    !mod3Fns.includes('answer') && !mod3Fns.includes('answer2'));
  const inst3 = new WebAssembly.Instance(mod3, {});
  check('third state answer3() returns 42', inst3.exports.answer3() === 42);
  st3.delete();

  const t2 = await loadTinyc({ target: 'x86_64-linux-gnu' });
  log.push('INFO: x86_64-linux-gnu fsBackend=' + t2.fsBackend);
  t2.addFile('/h.c', 'int add(int a, int b) { return a + b; }\n');
  const rc2 = t2.callMain(['-c', '/h.c', '-o', '/h.o']);
  check('x86_64-linux-gnu cross compile returns 0', rc2 === 0);
  const obj = t2.exportFile('/h.o');
  check('x86_64 product is an ELF object',
    obj[0] === 0x7f && obj[1] === 0x45 && obj[2] === 0x4c && obj[3] === 0x46);
  check('x86_64 product e_machine is 62 (EM_X86_64)',
    obj[18] === 62 && obj[19] === 0);

  // Section 4: the shipped sysroot. The sysroot envelopes are
  // fetched from ./pkg/sysroot/, the canonical location the
  // loader derives from the package's own URL.
  const ts = await loadTinyc({ target: 'wasm32-wasi', sysroot: true });
  const sts = ts.createState();
  check('sysroot state compileString returns 0',
    sts.compileString([
      '#include <stdatomic.h>',
      'static _Atomic int counter;',
      'int main(void) {',
      '  for (int i = 0; i < 100; i++) atomic_fetch_add(&counter, 1);',
      '  return atomic_load(&counter) == 100 ? 42 : 2;',
      '}',
    ].join('\n')) === 0);
  check('sysroot <stdatomic.h> program returns 42',
    await sts.run([]) === 42);
  sts.delete();

  const tx = await loadTinyc({ target: 'x86_64-linux-gnu', sysroot: true });
  tx.addFile('/s.c', [
    '#include <stdint.h>',
    '#include <stddef.h>',
    'uint64_t widen(uint32_t v) { return (uint64_t)v + (uint64_t)(size_t)sizeof(v); }',
    '',
  ].join('\n'));
  // callMain is the raw compiler entry: unlike the state API it
  // does not register the sysroot include directory, so the
  // consumer names it explicitly.
  const rc4 = tx.callMain(['-I/sysroot/include', '-c', '/s.c', '-o', '/s.o']);
  check('x86_64 sysroot cross compile returns 0', rc4 === 0);
  const sobj = tx.exportFile('/s.o');
  check('x86_64 sysroot product is an ELF object',
    sobj[0] === 0x7f && sobj[1] === 0x45 && sobj[2] === 0x4c && sobj[3] === 0x46);
  check('x86_64 sysroot product e_machine is 62 (EM_X86_64)',
    sobj[18] === 62 && sobj[19] === 0);

  // Section 5: stdio in a whole wasm32 program against the
  // shipped sysroot — <stdio.h>, <string.h>, <stdlib.h> and
  // <ctype.h> over the process layer's real supply. The host
  // stages a seed file in the instance VFS; the guest reads it
  // with fopen/fgets, parses it with sscanf, writes a result
  // file with fprintf/fputs, reads it back with fread, and the
  // host then reads the guest's file from the same VFS. The
  // guest's exit codes name the failing step.
  ts.addFile('/seed.txt', 'alpha 17 beta\n');
  const st5 = ts.createState();
  check('stdio state compileString returns 0',
    st5.compileString([
      '#include <stdio.h>',
      '#include <string.h>',
      '#include <stdlib.h>',
      '#include <ctype.h>',
      'int main(void) {',
      '  FILE *in = fopen("/seed.txt", "r");',
      '  if (!in) return 11;',
      '  char line[64];',
      '  if (!fgets(line, sizeof line, in)) return 12;',
      '  if (strcmp(line, "alpha 17 beta\\n") != 0) return 13;',
      '  if (fseek(in, 0, SEEK_END) != 0) return 14;',
      '  if (ftell(in) != 14) return 15;',
      '  fclose(in);',
      '  int n = 0;',
      '  char word[16];',
      '  if (sscanf(line, "%*s %d %15s", &n, word) != 2) return 16;',
      '  if (n != 17 || strcmp(word, "beta") != 0) return 17;',
      '  if (!isdigit(line[6]) || toupper(word[0]) != 66) return 18;',
      '  if (atoi("17") != n || strlen(word) != 4) return 22;',
      '  FILE *out = fopen("/result.txt", "w");',
      '  if (!out) return 19;',
      '  fprintf(out, "n=%d word=%s len=%lu\\n", n, word,',
      '          (unsigned long)strlen(word));',
      '  fputs("done\\n", out);',
      '  fclose(out);',
      '  FILE *back = fopen("/result.txt", "r");',
      '  if (!back) return 20;',
      '  char buf[64];',
      '  size_t got = fread(buf, 1, sizeof buf - 1, back);',
      '  buf[got] = 0;',
      '  fclose(back);',
      '  if (strcmp(buf, "n=17 word=beta len=4\\ndone\\n") != 0) return 21;',
      '  printf("stdio-ok %d\\n", n);',
      '  return 42;',
      '}',
    ].join('\n')) === 0);
  let stdioText = '';
  const rc5 = await st5.run([], {
    io: {
      out: (text) => { stdioText += text; },
      err: (text) => { stdioText += text; },
    },
  });
  check('stdio program returns 42', rc5 === 42);
  check('stdio program stdout carries its printf line',
    stdioText.includes('stdio-ok 17'));
  check('guest-written /result.txt is readable from the instance VFS',
    dec.decode(ts.exportFile('/result.txt')) ===
      'n=17 word=beta len=4\ndone\n');
  st5.delete();

// Math battery data: one descriptor per case,
//   [name, kind, form, ...args, toleranceClass]
// kind: u unary, i integer-returning unary, b binary,
// 3 fma, p frexp, m modf, q remquo, x ldexp/scalbn,
// n nan(tag). form: d double (also long double), f float.
// Args and expected float results are IEEE bit patterns
// in hex; integer results and frexp/remquo parts are
// decimal. Tolerance classes: E exact bit equality,
// U 2 ulp, R 4 ulp (erf), C 16 ulp (erfc), L lgamma
// (4 ulp or 4e-15 absolute), G tgamma (4 ulp or 4e-13
// relative). Expected values were computed at 60-digit
// precision from the exact mathematical functions.
const MATH_CASES = [["sin","u","d","0000000000000000","U"],["sin","u","d","8000000000000000","U"],["sin","u","d","3fe0000000000000","U"],["sin","u","d","bfe0000000000000","U"],["sin","u","d","3ff0000000000000","U"],["sin","u","d","bff0000000000000","U"],["sin","u","d","3ff8000000000000","U"],["sin","u","d","4004000000000000","U"],["sin","u","d","c004000000000000","U"],["sin","u","d","400921fb54442d18","U"],["sin","u","d","4024000000000000","U"],["sin","u","d","3fb999999999999a","U"],["sin","u","d","4086280000000000","U"],["sin","u","d","7e37e43c8800759c","U"],["sin","u","d","0000000000000001","U"],["sin","u","d","0010000000000000","U"],["sin","u","d","7fefffffffffffff","U"],["sin","u","d","7ff0000000000000","U"],["sin","u","d","fff0000000000000","U"],["sin","u","d","7ff8000000000000","U"],["sinf","u","f","00000000","U"],["sinf","u","f","80000000","U"],["sinf","u","f","3f000000","U"],["sinf","u","f","bf000000","U"],["sinf","u","f","3f800000","U"],["sinf","u","f","bf800000","U"],["sinf","u","f","3fc00000","U"],["sinf","u","f","40200000","U"],["sinf","u","f","c0200000","U"],["sinf","u","f","40490fdb","U"],["sinf","u","f","41200000","U"],["sinf","u","f","3dcccccd","U"],["sinf","u","f","44314000","U"],["sinf","u","f","7f800000","U"],["sinf","u","f","00000000","U"],["sinf","u","f","00000000","U"],["sinf","u","f","7f800000","U"],["sinf","u","f","7f800000","U"],["sinf","u","f","ff800000","U"],["sinf","u","f","7fc00000","U"],["sinl","u","d","0000000000000000","U"],["sinl","u","d","8000000000000000","U"],["sinl","u","d","3fe0000000000000","U"],["sinl","u","d","bfe0000000000000","U"],["sinl","u","d","3ff0000000000000","U"],["sinl","u","d","bff0000000000000","U"],["sinl","u","d","3ff8000000000000","U"],["sinl","u","d","4004000000000000","U"],["sinl","u","d","c004000000000000","U"],["sinl","u","d","400921fb54442d18","U"],["sinl","u","d","4024000000000000","U"],["sinl","u","d","3fb999999999999a","U"],["sinl","u","d","4086280000000000","U"],["sinl","u","d","7e37e43c8800759c","U"],       return `{ ${decl('a0', args[0])} ${T} ip; ${T} fr = ${fn}(a0, &ip); printf("${fmt} ${fmt}\\n", ${tk}(fr), ${tk}(ip)); }`;
    } else if (kind === 'q') {
      return `{ ${decl('a0', args[0])} ${decl('a1', args[1])} int q = 0; ${T} r = ${fn}(a0, a1, &q); printf("${fmt} %d\\n", ${tk}(r), q); }`;
    } else if (kind === 'x') {
      const n = args[1] === -2147483648 ? '(-2147483647-1)' : String(args[1]);
      return `{ ${decl('a0', args[0])} ${T} r = ${fn}(a0, ${n}); ${pr('r')} }`;
    }
    return `{ ${T} r = ${fn}("${args[0]}"); ${pr('r')} }`;
  }
  const MATH_CHUNK = 500;
  let mathCompileOk = true;
  let mathRunOk = true;
  const mathGot = [];
  for (let base = 0; base < MATH_CASES.length; base += MATH_CHUNK) {
    const lines = [...mathPrelude];
    for (let i = base; i < Math.min(base + MATH_CHUNK, MATH_CASES.length); i++) {
      lines.push(mathCaseLine(MATH_CASES[i]));
    }
    lines.push('  return 0;', '}');
    const stc = ts.createState();
    if (stc.compileString(lines.join('\n')) !== 0) mathCompileOk = false;
    let out = '';
    const rc = await stc.run([], {
      io: {
        out: (text) => { out += text; },
        err: (text) => { out += text; },
      },
    });
    if (rc !== 0) mathRunOk = false;
    const trimmed = out.trim();
    if (trimmed) mathGot.push(...trimmed.split('\n'));
    stc.delete();
  }
  check('math states compileString returns 0', mathCompileOk);
  check('math battery programs return 0', mathRunOk);
  check('math battery prints one line per case',
    mathGot.length === MATH_CASES.length);
  const dv6 = new DataView(new ArrayBuffer(8));
  const bitsEq = (a, b) => BigInt('0x' + a) === BigInt('0x' + b);
  function isNanHex(hex, isF) {
    const b = BigInt('0x' + hex);
    return isF
      ? ((b & 0x7f800000n) === 0x7f800000n && (b & 0x7fffffn) !== 0n)
      : ((b & 0x7ff0000000000000n) === 0x7ff0000000000000n && (b & 0xfffffffffffffn) !== 0n);
  }
  function ordOf(bits, isF) {
    const sign = isF ? 0x80000000n : (1n << 63n);
    const mask = isF ? 0xffffffffn : ((1n << 64n) - 1n);
    return (bits & sign) !== 0n ? (~bits & mask) : (bits | sign);
  }
  function ulpDist(aHex, bHex, isF) {
    const d = ordOf(BigInt('0x' + aHex), isF) - ordOf(BigInt('0x' + bHex), isF);
    return d < 0n ? -d : d;
  }
  function valOfHex(hex, isF) {
    if (isF) {
      dv6.setUint32(0, parseInt(hex, 16) >>> 0, true);
      return dv6.getFloat32(0, true);
    }
    dv6.setBigUint64(0, BigInt('0x' + hex), true);
    return dv6.getFloat64(0, true);
  }
  function scalarOk(cls, gotHex, wantHex, isF) {
    if (wantHex === 'nan') return isNanHex(gotHex, isF);
    const dist = ulpDist(gotHex, wantHex, isF);
    switch (cls) {
      case 'E': return dist === 0n;
      case 'U': return dist <= 2n;
      case 'R': return dist <= 4n;
      case 'C': return dist <= 16n;
      case 'L': return dist <= 4n ||
        Math.abs(valOfHex(gotHex, isF) - valOfHex(wantHex, isF)) <= 4e-15;
      case 'G': return dist <= 4n ||
        Math.abs(valOfHex(gotHex, isF) - valOfHex(wantHex, isF)) <=
          4e-13 * Math.max(Math.abs(valOfHex(wantHex, isF)), 1e-300);
    }
    return false;
  }
  let mathBad = 0;
  const mathBadNames = [];
  for (let i = 0; i < MATH_CASES.length && i < mathGot.length; i++) {
    const c = MATH_CASES[i];
    const fn = c[0], kind = c[1], isF = c[2] === 'f', cls = c[c.length - 1];
    const want = MATH_EXPECT[i];
    const line = mathGot[i];
    let good;
    if (kind === 'u' || kind === 'b' || kind === '3' || kind === 'x') {
      good = scalarOk(cls, line, want, isF);
    } else if (kind === 'i' || kind === 'n') {
      good = kind === 'i' ? line === want : bitsEq(line, want);
    } else {
      const tok = line.split(' ');
      const firstOk = want[0] === 'nan' ? isNanHex(tok[0], isF) : bitsEq(tok[0], want[0]);
      const secondOk = kind === 'm'
        ? (want[1] === 'nan' ? isNanHex(tok[1], isF) : bitsEq(tok[1], want[1]))
        : tok[1] === want[1];
      good = firstOk && secondOk;
    }
    if (!good) {
      mathBad++;
      if (mathBadNames.length < 8) {
        mathBadNames.push(fn + ' case ' + i + ': got ' + line +
          ' want ' + JSON.stringify(want));
      }
    }
  }
  check('math battery: all ' + MATH_CASES.length +
    ' cases within their tolerance class', mathBad === 0);
  if (mathBadNames.length) {
    log.push('INFO: math mismatches: ' + mathBadNames.join('; '));
  }

  // Section 7: the stdio completion set — fdopen, tmpfile,
  // setvbuf/setbuf and perror with the shim layer's errno. The
  // guest names the failing step in its exit code; perror's
  // output is checked on the host's captured stderr, and the
  // host also checks that the closed tmpfile left nothing in
  // the instance VFS.
  const st7 = ts.createState();
  check('part2 state compileString returns 0',
    st7.compileString([
      '#include <stdio.h>',
      '#include <string.h>',
      'int main(void) {',
      '  if (fdopen(1, "w") != stdout) return 31;',
      '  if (fdopen(99, "w") != NULL) return 32;',
      '  FILE *tf = tmpfile();',
      '  if (!tf) return 33;',
      '  fputs("tmp-data", tf);',
      '  rewind(tf);',
      '  char buf[32];',
      '  if (!fgets(buf, sizeof buf, tf)) return 34;',
      '  if (strcmp(buf, "tmp-data") != 0) return 35;',
      '  fclose(tf);',
      '  FILE *f = fopen("/svb.txt", "w");',
      '  if (!f) return 36;',
      '  if (setvbuf(f, NULL, _IOFBF, 1024) != 0) return 37;',
      '  if (setvbuf(f, NULL, _IONBF, 0) != 0) return 38;',
      '  setbuf(f, NULL);',
      '  if (setvbuf((FILE *)(long)999, NULL, _IOFBF, 0) == 0) return 39;',
      '  fclose(f);',
      '  if (fopen("/definitely-missing.txt", "r") != NULL) return 40;',
      '  perror("guest-open");',
      '  printf("part2-ok\\n");',
      '  return 42;',
      '}',
    ].join('\n')) === 0);
  let part2Out = '';
  let part2Err = '';
  const rc7 = await st7.run([], {
    io: {
      out: (text) => { part2Out += text; },
      err: (text) => { part2Err += text; },
    },
  });
  check('part2 program returns 42', rc7 === 42);
  check('part2 program stdout carries its line',
    part2Out.includes('part2-ok'));
  check('perror prints the recorded error text to stderr',
    part2Err.includes('guest-open: No such file or directory'));
  check('closed tmpfile leaves nothing in the instance VFS',
    !ts.fs.listFiles('/').some((name) => name.includes('tmpfile-')));
  st7.delete();
} catch (e) {
  ok = false;
  log.push('ERROR: ' + ((e && e.stack) || e));
}

window.__TINYC_LOG__ = log;
window.__TINYC_OK__ = ok;
window.__TINYC_DONE__ = true;
document.title = ok ? 'TINYC-BROWSER-PASS' : 'TINYC-BROWSER-FAIL';
</script>
<body>tinyc browser consumer test</body>
