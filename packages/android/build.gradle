// TinyC Android library (AAR). Standalone module: run `gradle assembleRelease`
// in this directory (or via ./build.sh) to produce the .aar.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.tinyc'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35

        // The native kernel is a set of prebuilt dual-form files placed in
        // src/main/jniLibs/<abi>/libtinyc-<target>.so by the kernel build
        // (see src/main/jni/CMakeLists.txt for how it is produced).
        // No externalNativeBuild here on purpose: the JNI glue in
        // src/main/jni/ is compiled INTO that file, not into a
        // separate library shipped by this AAR.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        androidTest {
            java.srcDirs = ['src/androidTest/java']
        }
        test {
            java.srcDirs = ['src/test/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
