<!doctype html>
<meta charset="utf-8">
<title>tinyc cstd2 suite</title>
<script type="module">
import * as indexModule from '/index.mjs';
import { createProcess } from '/index.mjs';
import { runSuite, createStandaloneRunner } from '/test-cstd2/suite.mjs';

const UNIT_NAMES = ['libtcc1.tinyc.js'];
const GUEST_NAMES = [
  'lldiv_probe', 'addr_probe', 'time_probe', 'errno_probe',
  'env_probe', 'struct_probe',
  'lldiv_probe_sa', 'addr_probe_sa', 'env_probe_sa',
];

async function fetchBytes(name) {
  const res = await fetch('/' + name);
  if (!res.ok) throw new Error(`fetch ${name}: HTTP ${res.status}`);
  return new Uint8Array(await res.arrayBuffer());
}

try {
  const units = new Map();
  for (const name of UNIT_NAMES) units.set(name, await fetchBytes(name));
  const guests = new Map();
  for (const name of GUEST_NAMES) guests.set(name, await fetchBytes(name));
  const runStandalone = await createStandaloneRunner(
    indexModule, (url) => fetch(url));
  const tier = window.crossOriginIsolated ? 'real' : 'simulated';
  const results = await runSuite({
    createProcess,
    guestBytes: async (name) => guests.get(name),
    units,
    runStandalone,
    tier,
    onCase: (name) => { document.title = 'running: ' + name; },
  });
  window.__cstd2Result = { tier, results };
} catch (err) {
  window.__cstd2Result = {
    tier: window.crossOriginIsolated ? 'real' : 'simulated',
    results: [{ name: 'harness', ok: false, detail: String(err && err.stack || err) }],
  };
}
document.title = 'done';
</script>
